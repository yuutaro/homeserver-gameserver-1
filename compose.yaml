services:
  modsync-prod:
    image: node:24-alpine
    working_dir: /work
    environment:
      CF_API_KEY: ${CF_API_KEY:-}
    volumes:
      - ./tools/modsync:/work:ro
      - ./1.20.1 ver4.1 modlist.csv:/work/modlist.csv:ro
      - ./data/mc-prod/mods:/out
    command: ["node", "/work/modsync.mjs", "--csv", "/work/modlist.csv", "--out", "/out", "--mc", "1.20.1", "--loader", "forge"]

  modsync-test:
    image: node:24-alpine
    working_dir: /work
    environment:
      CF_API_KEY: ${CF_API_KEY:-}
    volumes:
      - ./tools/modsync:/work:ro
      - ./1.20.1 ver4.1 modlist.csv:/work/modlist.csv:ro
      - ./data/mc-test/mods:/out
    command: ["node", "/work/modsync.mjs", "--csv", "/work/modlist.csv", "--out", "/out", "--mc", "1.20.1", "--loader", "forge"]

  discord-bot:
    build:
      context: ./apps/discord-bot
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:?set_in_.env}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:?set_in_.env}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_SUPERUSER_IDS: ${DISCORD_SUPERUSER_IDS:-}
      DISCORD_DISABLE_LOGIN: ${DISCORD_DISABLE_LOGIN:-false}
      DOCKER_ALLOW_SERVICES: ${DOCKER_ALLOW_SERVICES:-mc-prod,mc-test}
      MC_PROD_RCON_HOST: ${MC_PROD_RCON_HOST:-mc-prod}
      MC_PROD_RCON_PORT: ${MC_PROD_RCON_PORT:-25575}
      MC_PROD_RCON_PASSWORD: ${MC_PROD_RCON_PASSWORD:?set_in_.env}
      MC_TEST_RCON_HOST: ${MC_TEST_RCON_HOST:-mc-test}
      MC_TEST_RCON_PORT: ${MC_TEST_RCON_PORT:-25575}
      MC_TEST_RCON_PASSWORD: ${MC_TEST_RCON_PASSWORD:?set_in_.env}
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./logs:/app/logs
    networks:
      - internal
    depends_on:
      - mc-prod
      - mc-test

  mc-prod:
    image: itzg/minecraft-server:latest
    restart: unless-stopped
    env_file:
      - ./config/mc-prod.env
    environment:
      RCON_PASSWORD: ${MC_PROD_RCON_PASSWORD:?set_in_.env}
      CF_API_KEY: ${CF_API_KEY:-}
    volumes:
      - ./data/mc-prod:/data
    ports:
      - "30003:25565/tcp"
    networks:
      - internal
    depends_on:
      modsync-prod:
        condition: service_completed_successfully

  mc-test:
    image: itzg/minecraft-server:latest
    restart: unless-stopped
    env_file:
      - ./config/mc-test.env
    environment:
      RCON_PASSWORD: ${MC_TEST_RCON_PASSWORD:?set_in_.env}
      CF_API_KEY: ${CF_API_KEY:-}
    volumes:
      - ./data/mc-test:/data
    ports:
      - "30004:25565/tcp"
    networks:
      - internal
    depends_on:
      modsync-test:
        condition: service_completed_successfully

networks:
  internal:
    driver: bridge
