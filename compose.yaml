services:
  discord-bot:
    build:
      context: ./apps/discord-bot
    env_file:
      - ${BOT_ENV_FILE:-.env}
    environment:
      DATA_DIR: ${DATA_DIR:-/data}
      BOT_DATA_DIR: ${DATA_DIR:-/data}
      DOCKER_DATA_DIR: ${DATA_DIR:-/data}
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_DIR:-/data}:${DATA_DIR:-/data}:ro
    networks:
      - gameserver-net

networks:
  gameserver-net:
    name: gameserver-net
    driver: bridge
