services:
  discord-bot:
    build:
      context: ./apps/discord-bot
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:?set_in_.env}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:?set_in_.env}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_SUPERUSER_IDS: ${DISCORD_SUPERUSER_IDS:-}
      DISCORD_DISABLE_LOGIN: ${DISCORD_DISABLE_LOGIN:-false}
      DOCKER_ALLOW_SERVICES: ${DOCKER_ALLOW_SERVICES:-mc-prod,mc-test}
      MC_PROD_RCON_HOST: ${MC_PROD_RCON_HOST:-mc-prod}
      MC_PROD_RCON_PORT: ${MC_PROD_RCON_PORT:-25575}
      MC_PROD_RCON_PASSWORD: ${MC_PROD_RCON_PASSWORD:?set_in_.env}
      MC_TEST_RCON_HOST: ${MC_TEST_RCON_HOST:-mc-test}
      MC_TEST_RCON_PORT: ${MC_TEST_RCON_PORT:-25575}
      MC_TEST_RCON_PASSWORD: ${MC_TEST_RCON_PASSWORD:?set_in_.env}
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./logs:/app/logs
    networks:
      - internal
    depends_on:
      - mc-prod
      - mc-test

  mc-prod:
    image: itzg/minecraft-server:latest
    restart: unless-stopped
    environment:
      EULA: "TRUE"
      VERSION: "1.20.1"
      ENABLE_RCON: "true"
      RCON_PORT: "25575"
      RCON_PASSWORD: ${MC_PROD_RCON_PASSWORD:?set_in_.env}
      # Keep the server port internal; host publishes 30003 -> 25565
      SERVER_PORT: "25565"
      TYPE: "FORGE"
      # Auto-download mods (prefer Modrinth; use CurseForge for projects not on Modrinth)
      MODRINTH_PROJECTS: ${MC_PROD_MODRINTH_PROJECTS:-}
      CURSEFORGE_FILES: ${MC_PROD_CURSEFORGE_FILES:-}
      CF_API_KEY: ${CF_API_KEY:-}
      # Optional tuning
      MEMORY: "4G"
    volumes:
      - ./data/mc-prod:/data
    ports:
      - "30003:25565/tcp"
    networks:
      - internal

  mc-test:
    image: itzg/minecraft-server:latest
    restart: unless-stopped
    environment:
      EULA: "TRUE"
      VERSION: "1.20.1"
      ENABLE_RCON: "true"
      RCON_PORT: "25575"
      RCON_PASSWORD: ${MC_TEST_RCON_PASSWORD:?set_in_.env}
      SERVER_PORT: "25565"
      TYPE: "FORGE"
      MODRINTH_PROJECTS: ${MC_TEST_MODRINTH_PROJECTS:-}
      CURSEFORGE_FILES: ${MC_TEST_CURSEFORGE_FILES:-}
      CF_API_KEY: ${CF_API_KEY:-}
      MEMORY: "2G"
    volumes:
      - ./data/mc-test:/data
    ports:
      - "30004:25565/tcp"
    networks:
      - internal

networks:
  internal:
    driver: bridge
