name: Deploy discord-bot (self-hosted)

on:
  push:
    branches: [main]

concurrency:
  group: deploy-bot
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy bot
        env:
          BOT_ENV_FILE: ${{ vars.BOT_ENV_FILE }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          DATA_DIR: ${{ vars.DATA_DIR }}
        run: |
          set -euo pipefail
          : "${BOT_ENV_FILE:?set repository variable BOT_ENV_FILE}"
          : "${DEPLOY_DIR:?set repository variable DEPLOY_DIR}"
          : "${DATA_DIR:?set repository variable DATA_DIR}"
          if [[ ! -d "${DEPLOY_DIR}/.git" ]]; then
            mkdir -p "$(dirname "${DEPLOY_DIR}")"
            git clone "${REPO_URL}" "${DEPLOY_DIR}"
          fi
          if [[ -n "$(git -C "${DEPLOY_DIR}" status --porcelain --untracked-files=all)" ]]; then
            echo "Refusing deploy: production checkout has uncommitted changes. Preserve and commit them in development first." >&2
            git -C "${DEPLOY_DIR}" status --short --untracked-files=all >&2
            exit 1
          fi
          git -C "${DEPLOY_DIR}" fetch origin main
          if ! git -C "${DEPLOY_DIR}" merge-base --is-ancestor HEAD origin/main; then
            echo "Refusing deploy: production checkout has local commits not present in origin/main." >&2
            exit 1
          fi
          git -C "${DEPLOY_DIR}" merge --ff-only origin/main
          PROD_ROOT_DIR="${DEPLOY_DIR}" BOT_ENV_FILE="${BOT_ENV_FILE}" DATA_DIR="${DATA_DIR}" bash "${DEPLOY_DIR}/scripts/deploy-bot.sh"
