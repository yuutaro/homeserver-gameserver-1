name: Deploy discord-bot (self-hosted)

on:
  push:
    branches: [main]

concurrency:
  group: deploy-bot
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy bot
        env:
          BOT_ENV_FILE: /etc/homeserver-gameserver/bot.env
          DEPLOY_DIR: /opt/homeserver-gameserver-1
          REPO_URL: https://github.com/example-owner/homeserver-gameserver-1.git
        run: |
          set -euo pipefail
          if [[ ! -d "${DEPLOY_DIR}/.git" ]]; then
            mkdir -p "$(dirname "${DEPLOY_DIR}")"
            git clone "${REPO_URL}" "${DEPLOY_DIR}"
          fi
          git -C "${DEPLOY_DIR}" fetch origin main
          git -C "${DEPLOY_DIR}" reset --hard origin/main
          BOT_ENV_FILE="${BOT_ENV_FILE}" bash "${DEPLOY_DIR}/scripts/deploy-bot.sh"
