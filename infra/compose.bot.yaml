services:
  bot:
    build:
      context: ../apps/discord-bot
    env_file:
      - ${BOT_ENV_FILE}
    environment:
      # Keep server data under the project directory on the host.
      # Use the same absolute path inside the bot container so the bot can both
      # scan and pass bind-mount paths to Docker without translation.
      DATA_DIR: ${DATA_DIR}
      BOT_DATA_DIR: ${DATA_DIR}
      DOCKER_DATA_DIR: ${DATA_DIR}
      MC_CONTAINER_NAME: ${MC_CONTAINER_NAME:-mc-prod}
      MC_IMAGE: ${MC_IMAGE:-itzg/minecraft-server:latest}
      MC_NETWORK: ${MC_NETWORK:-gameserver-net}
      MC_HOST_PORT: ${MC_HOST_PORT:-25565}
      MC_RCON_HOST: ${MC_RCON_HOST:-mc-prod}
      MC_RCON_PORT: ${MC_RCON_PORT:-25575}
      DISCORD_DISABLE_LOGIN: ${DISCORD_DISABLE_LOGIN:-false}
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_DIR}:${DATA_DIR}:ro
    networks:
      - gameserver-net

networks:
  gameserver-net:
    name: gameserver-net
    driver: bridge
