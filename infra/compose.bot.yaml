services:
  bot:
    build:
      context: ../apps/discord-bot
    env_file:
      - ${BOT_ENV_FILE}
    environment:
      # Keep server data under the project directory on the host.
      # Use the same absolute path inside the bot container so the bot can both
      # scan and pass bind-mount paths to Docker without translation.
      #
      # NOTE: Compose variable substitution does NOT read values from env_file.
      # Only use env_file for MC_* and DISCORD_* settings; keep DATA_DIR here.
      DATA_DIR: ${DATA_DIR}
      BOT_DATA_DIR: ${DATA_DIR}
      DOCKER_DATA_DIR: ${DATA_DIR}
      PROD_DATA_DIR: ${DATA_DIR}
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_DIR}:${DATA_DIR}:ro
    networks:
      - gameserver-net

networks:
  gameserver-net:
    name: gameserver-net
    driver: bridge
